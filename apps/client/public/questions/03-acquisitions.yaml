question: Where in the UK has the most Sentinel-2 acquisitions?
file: data/areas.json
variable: num_acquisitions
variable_label: Number of acquisitions
statistic: max
top_n: 2000
time_limit: 60
story: |
  The number of acquisitions is a measure of how many times the area has been imaged by satellites. This is important because it affects the quality of the data we can use to estimate cloudiness.

  As we can see from the map, the pattern is quite variable across the UK, with some small areas getting many more acquisitions! This is due to the orbit of the satellite - some areas are imaged more frequently than others, and the satellite's orbit is not perfectly uniform across the UK.

  You may notice that the acquisition pattern looks strange in some parts of the UK - this is due to the fact that we are aggregating down to LSOA level. The pattern on this map looks closer to the actual acquisition pattern where we have more densely packed LSOAs, and stranger where we have larger ones. This also explains why some LSOAs have a decimal number of acquisitions - since we are averaging the acquisition count per pixel across the LSOA!
